name: Hosted availability

on:
  schedule:
    # shortcut: GitHub can delay schedules; use dedicated hosting for guaranteed availability.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the deployed Doedu service
        shell: bash
        run: |
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 1 --retry-delay 5 \
            --retry-max-time 125 --retry-connrefused \
            --output "$response" \
            --write-out 'HTTP %{http_code}; response time %{time_total}s\n' \
            'https://doedu-kazakhstan-test-x3wv.onrender.com/api/health/ready/'
          python3 - "$response" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as response:
              health = json.load(response)
          for component in ("status", "database", "migrations"):
              if health.get(component) != "ok":
                  raise SystemExit(f"Doedu readiness failed: {component}")
          print("Doedu web service, database and migrations are ready.")
          if health.get("worker") != "ok":
              print("::warning::Doedu worker heartbeat is not ready yet.")
          PY
