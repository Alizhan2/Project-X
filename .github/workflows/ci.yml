# CI for Doedu. Every job uses synthetic data and throw-away resources (service containers / the runner).
# First successful runner execution: ac46440 (five jobs). Every new revision must pass its own run.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

env:
  PG_IMAGE: postgres:17.11-bookworm

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env: { POSTGRES_USER: doedu, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: doedu }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doedu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install --require-hashes -r requirements.txt     # the hash-locked set: what production runs
      - run: python manage.py check
      - name: Deployment checks (production-like settings must start and pass `check --deploy`)
        run: |
          DOEDU_ENV=production DOEDU_LAUNCH_MODE=demo DJANGO_DEBUG=false DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
          DJANGO_ALLOWED_HOSTS=ci.example.org DJANGO_CSRF_TRUSTED_ORIGINS=https://ci.example.org DJANGO_SECURE_SSL=true \
          DOEDU_TRUSTED_PROXIES=1 POSTGRES_PASSWORD=ci-only-password python manage.py check --deploy 2>&1 | tee /tmp/deploy.txt
          # Only the two deliberate HSTS rollout notes (W005 includeSubDomains, W021 preload) may remain: docs/deployment.md.
          if grep -E "security\.[WEC][0-9]+" /tmp/deploy.txt | grep -vE "W005|W021"; then echo "unexpected deployment warnings"; exit 1; fi
      - run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed
        run: |
          python manage.py spectacular --validate --fail-on-warn --file ../docs/openapi.yaml
          git diff --exit-code ../docs/openapi.yaml
      - run: python manage.py test --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build            # includes the TypeScript type check (tsc -b)
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 3 }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17.11-bookworm
        env: { POSTGRES_USER: doedu_admin, POSTGRES_PASSWORD: ci-only-admin, POSTGRES_DB: doedu }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doedu_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:   # production-like: gunicorn + WhiteNoise-served SPA + restricted DB roles + separate worker (ops/run-staging.sh)
      DOEDU_ENV: staging
      DOEDU_LAUNCH_MODE: demo
      DOEDU_RELEASE: ci-${{ github.sha }}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000
      DOEDU_ALLOW_DEMO_TOOLS: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: doedu
      POSTGRES_USER: doedu_app
      POSTGRES_PASSWORD: ci-only-app-password
      MIGRATE_POSTGRES_USER: doedu_migrator
      MIGRATE_POSTGRES_PASSWORD: ci-only-migrator-password
      POSTGRES_ADMIN_USER: doedu_admin
      POSTGRES_ADMIN_PASSWORD: ci-only-admin
      DEMO_USER_PASSWORD: ci-only-synthetic-demo-password   # deployed environments must set it explicitly (no well-known default)
      THROTTLE_LOGIN: 1000/min        # the suite signs in constantly from one IP
      THROTTLE_REGISTER: 1000/hour
      THROTTLE_SEARCH: 5000/min
      THROTTLE_BOOKING: 5000/min
      FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
      GUNICORN_BIND: 127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install --require-hashes -r backend/requirements.txt
      - name: Throw-away secret key for this run (masked in logs)
        run: |
          key="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - run: ops/run-staging.sh
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: BASE_URL=http://127.0.0.1:8000 npm run e2e
        working-directory: frontend
      - name: Business-invariant check after the browser run
        run: python manage.py check_integrity
        working-directory: backend
      - if: failure()
        run: for f in /tmp/doedu-web.log /tmp/doedu-worker.log; do echo "== $f"; tail -n 50 "$f" || true; done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Python dependency vulnerabilities (hash-locked set)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --require-hashes
      - name: JavaScript dependency vulnerabilities
        run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - name: Secret scan (fails only on findings not in .secrets.baseline)
        run: |
          pip install detect-secrets
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: |
          cp .env.production.example .env.production
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^MIGRATE_POSTGRES_PASSWORD=.*/MIGRATE_POSTGRES_PASSWORD=x/; s/^POSTGRES_ADMIN_PASSWORD=.*/POSTGRES_ADMIN_PASSWORD=x/' .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
      - name: Build the production image
        run: docker build --build-arg DOEDU_RELEASE=ci-${{ github.sha }} -t doedu:ci .
      - name: Image runs as non-root and answers liveness without a database
        run: |
          test "$(docker run --rm --entrypoint id doedu:ci -u)" = "10001"
          docker run -d --name smoke -e DOEDU_ENV=development -e DJANGO_DEBUG=false doedu:ci
          for i in $(seq 1 20); do docker exec smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live/')" && break; sleep 1; done
          docker exec smoke python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/health/live/').read())"
