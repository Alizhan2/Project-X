  /api/search/:
    get:
      operationId: search_retrieve
      description: Search direct and multi-leg (up to 3) journeys. Results are offers,
        not bookings; nothing is reserved.
      parameters:
      - in: query
        name: arrive_by
        schema:
          type: string
        description: Arrival deadline (inclusive); searches departures in the preceding
          24 hours. Defaults to latest_departure sorting.
      - in: query
        name: depart_after
        schema:
          type: string
        description: ISO datetime. Provide exactly one of depart_after or arrive_by;
          naive values use Europe/Berlin.
      - in: query
        name: destination
        schema:
          type: string
        description: Stop code
        required: true
      - in: query
        name: max_connection_minutes
        schema:
          type: integer
        description: Optional 5-180 minute cap from arrival to the next departure,
          including walking.
      - in: query
        name: max_transfers
        schema:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
          - any
        description: Maximum changes; any defaults to 2.
      - in: query
        name: modes
        schema:
          type: string
        description: 'Comma-separated allowed modes: bus,train,taxi. Default all;
          every leg must match.'
      - in: query
        name: origin
        schema:
          type: string
        description: Stop code
        required: true
      - in: query
        name: passengers
        schema:
          type: integer
        description: 1-9, default 1
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - buffer
          - departure
          - duration
          - latest_departure
          - price
        description: Default departure for depart_after, latest_departure for arrive_by.
          Also price, duration and buffer.
      tags:
      - search
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
  /api/search/days/:
    get:
      operationId: search_days_retrieve
      description: |-
        Cheapest and fastest journey per day around a date (a price calendar). Uses the same planner as /search/,
        so every number matches what the passenger will see after choosing that day. Past days have no journeys.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Centre day, YYYY-MM-DD (demo timezone)
        required: true
      - in: query
        name: destination
        schema:
          type: string
        description: Stop code
        required: true
      - in: query
        name: modes
        schema:
          type: string
        description: 'Comma-separated allowed modes: bus,train,taxi'
      - in: query
        name: origin
        schema:
          type: string
        description: Stop code
        required: true
      - in: query
        name: passengers
        schema:
          type: integer
        description: 1-9, default 1
      - in: query
        name: span
        schema:
          type: integer
        description: Days either side of `date`, 0-3 (default 3)
      - in: query
        name: time
        schema:
          type: string
        description: Earliest departure each day, HH:MM (default 00:00)
      tags:
      - search
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/stops/:
    get:
      operationId: stops_list
      description: Controlled list of stops usable as origin/destination.
      tags:
