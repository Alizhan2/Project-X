openapi: 3.0.3
info:
  title: Doedu API
  version: dev
  description: Multimodal transport booking MVP. All data, payments and confirmations
    are SIMULATED.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the `csrftoken` cookie. The SPA echoes it in the X-CSRFToken
        header on unsafe requests.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/email-verification/:
    post:
      operationId: auth_email_verification_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/email-verification/confirm/:
    post:
      operationId: auth_email_verification_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenIn'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: '`{"user": {...}}`, or `{"user": null}` when anonymous (200 either
        way so the SPA can bootstrap).'
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailIn'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetIn'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Create a passenger account (the only self-service role) and sign in. Can be closed with REGISTRATION_ENABLED=false.
        Email verification is available separately; the synthetic demo does not gate bookings on it.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/:
    get:
      operationId: bookings_list
      description: 'POST: revalidate the selected legs, hold capacity, create a pending
        booking (idempotent). GET: my bookings.'
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          description: ''
    post:
      operationId: bookings_create
      description: 'POST: revalidate the selected legs, hold capacity, create a pending
        booking (idempotent). GET: my bookings.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutIn'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/:
    get:
      operationId: bookings_detail
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/abandon/:
    post:
      operationId: bookings_abandon_create
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/calendar/:
    get:
      operationId: bookings_calendar_retrieve
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/calendar:
              schema:
                type: string
                format: binary
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: 'Cancel the whole journey and receive the simulated refund. Safe
        to repeat: never refunds twice.'
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelIn'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/cancellation/:
    get:
      operationId: bookings_cancellation_retrieve
      description: What cancelling now would refund, per leg, under the policy snapshotted
        at purchase.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/pay/:
    post:
      operationId: bookings_pay_create
      description: SIMULATED payment. Never accepts card details. Disabled when the
        launch mode does not allow simulation.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayIn'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/pdf/:
    get:
      operationId: bookings_pdf_retrieve
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/replacements/:
    get:
      operationId: bookings_replacements_retrieve
      description: Replacement options for a disrupted booking (refreshes them first).
        Offers do not reserve places.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/replacements/{offer_id}/accept/:
    post:
      operationId: bookings_replacements_accept_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: offer_id
        schema:
          type: integer
        required: true
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptIn'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{reference}/replacements/{offer_id}/decline/:
    post:
      operationId: bookings_replacements_decline_create
      parameters:
      - in: path
        name: offer_id
        schema:
          type: integer
        required: true
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/upcoming/:
    get:
      operationId: bookings_upcoming_retrieve
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/config/:
    get:
      operationId: config_retrieve
      description: 'Public runtime configuration for the SPA: what this deployment
        is allowed to claim.'
      tags:
      - config
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/favorites/:
    get:
      operationId: favorites_list
      tags:
      - favorites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteOut'
          description: ''
    post:
      operationId: favorites_create
      tags:
      - favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavoriteIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavoriteIn'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteOut'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteOut'
          description: ''
  /api/favorites/{id}/:
    delete:
      operationId: favorites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - favorites
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Readiness: can this instance serve traffic? Database reachable and no pending migrations.
        The worker state is informational (a stale worker must not take the web tier out of rotation).
        The body contains no versions, hostnames or credentials.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/live/:
    get:
      operationId: health_live_retrieve
      description: 'Liveness: the process answers. Touches nothing else, so a database
        outage never restarts healthy app servers.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: |-
        Readiness: can this instance serve traffic? Database reachable and no pending migrations.
        The worker state is informational (a stale worker must not take the web tier out of rotation).
        The body contains no versions, hostnames or credentials.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/itinerary/:
    get:
      operationId: itinerary_retrieve
      description: Current, freshly computed details for a selected journey (what
        checkout would use).
      parameters:
      - in: query
        name: arrive_by
        schema:
          type: string
        description: Optional arrival deadline to revalidate against current times.
      - in: query
        name: legs
        schema:
          type: string
        description: departure_id:from_stop:to_stop, comma separated
        required: true
      - in: query
        name: passengers
        schema:
          type: integer
      tags:
      - itinerary
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/kazakhstan/catalog/:
    get:
      operationId: kazakhstan_catalog_retrieve
      tags:
      - kazakhstan
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/kazakhstan/plans/:
    get:
      operationId: kazakhstan_plans_list
      tags:
      - kazakhstan
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanOutput'
          description: ''
    post:
      operationId: kazakhstan_plans_create
      tags:
      - kazakhstan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOutput'
          description: ''
  /api/kazakhstan/plans/{id}/:
    put:
      operationId: kazakhstan_plans_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - kazakhstan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOutput'
          description: ''
    delete:
      operationId: kazakhstan_plans_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - kazakhstan
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/kazakhstan/search/:
    get:
      operationId: kazakhstan_search_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: destination
        schema:
          enum:
          - kz-astana
          - kz-almaty
          - kz-shymkent
          - kz-kokshetau
          - kz-aktobe
          - kz-atyrau
          - kz-oral
          - kz-aktau
          - kz-kostanay
          - kz-petropavl
          - kz-pavlodar
          - kz-karaganda
          - kz-zhezkazgan
          - kz-oskemen
          - kz-semey
          - kz-taldykorgan
          - kz-konaev
          - kz-taraz
          - kz-kyzylorda
          - kz-turkistan
          type: string
          minLength: 1
        description: |-
          * `kz-astana` - kz-astana
          * `kz-almaty` - kz-almaty
          * `kz-shymkent` - kz-shymkent
          * `kz-kokshetau` - kz-kokshetau
          * `kz-aktobe` - kz-aktobe
          * `kz-atyrau` - kz-atyrau
          * `kz-oral` - kz-oral
          * `kz-aktau` - kz-aktau
          * `kz-kostanay` - kz-kostanay
          * `kz-petropavl` - kz-petropavl
          * `kz-pavlodar` - kz-pavlodar
          * `kz-karaganda` - kz-karaganda
          * `kz-zhezkazgan` - kz-zhezkazgan
          * `kz-oskemen` - kz-oskemen
          * `kz-semey` - kz-semey
          * `kz-taldykorgan` - kz-taldykorgan
          * `kz-konaev` - kz-konaev
          * `kz-taraz` - kz-taraz
          * `kz-kyzylorda` - kz-kyzylorda
          * `kz-turkistan` - kz-turkistan
        required: true
      - in: query
        name: modes
        schema:
          enum:
          - bus,train
          - bus
          - train
          type: string
          default: bus,train
          minLength: 1
        description: |-
          * `bus,train` - bus,train
          * `bus` - bus
          * `train` - train
      - in: query
        name: origin
        schema:
          enum:
          - kz-astana
          - kz-almaty
          - kz-shymkent
          - kz-kokshetau
          - kz-aktobe
          - kz-atyrau
          - kz-oral
          - kz-aktau
          - kz-kostanay
          - kz-petropavl
          - kz-pavlodar
          - kz-karaganda
          - kz-zhezkazgan
          - kz-oskemen
          - kz-semey
          - kz-taldykorgan
          - kz-konaev
          - kz-taraz
          - kz-kyzylorda
          - kz-turkistan
          type: string
          minLength: 1
        description: |-
          * `kz-astana` - kz-astana
          * `kz-almaty` - kz-almaty
          * `kz-shymkent` - kz-shymkent
          * `kz-kokshetau` - kz-kokshetau
          * `kz-aktobe` - kz-aktobe
          * `kz-atyrau` - kz-atyrau
          * `kz-oral` - kz-oral
          * `kz-aktau` - kz-aktau
          * `kz-kostanay` - kz-kostanay
          * `kz-petropavl` - kz-petropavl
          * `kz-pavlodar` - kz-pavlodar
          * `kz-karaganda` - kz-karaganda
          * `kz-zhezkazgan` - kz-zhezkazgan
          * `kz-oskemen` - kz-oskemen
          * `kz-semey` - kz-semey
          * `kz-taldykorgan` - kz-taldykorgan
          * `kz-konaev` - kz-konaev
          * `kz-taraz` - kz-taraz
          * `kz-kyzylorda` - kz-kyzylorda
          * `kz-turkistan` - kz-turkistan
        required: true
      - in: query
        name: passengers
        schema:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
      - in: query
        name: time
        schema:
          type: string
          format: time
          default: 06:00:00
      tags:
      - kazakhstan
      security:
      - cookieAuth: []
      - {}
