      responses:
        '204':
          description: No response body
components:
  schemas:
    AcceptIn:
      type: object
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          default: success
          description: |-
            Simulator only (top-up payment).

            * `success` - success
            * `failure` - failure
    ActionEnum:
      enum:
      - delay
      - cancel
      type: string
      description: |-
        * `delay` - delay
        * `cancel` - cancel
    BookingList:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - results
    CancelIn:
      type: object
      properties:
        expected_refund:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    ChangeIn:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        minutes:
          type: integer
          maximum: 720
          minimum: 0
          default: 0
      required:
      - action
    CheckoutIn:
      type: object
      properties:
        arrive_by:
          type: string
          format: date-time
        passengers:
          type: integer
          maximum: 9
          minimum: 1
        legs:
          type: array
          items:
            $ref: '#/components/schemas/LegIn'
        expected_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        contact_email:
          type: string
          format: email
        travellers:
          type: array
          items:
            type: string
            maxLength: 150
      required:
      - contact_email
      - legs
      - passengers
      - travellers
    Csrf:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailIn:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    FavoriteIn:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
      required:
      - destination
      - origin
    FavoriteOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        origin:
          type: string
        origin_name:
          type: string
        destination:
          type: string
        destination_name:
          type: string
      required:
      - destination
      - destination_name
      - id
      - origin
      - origin_name
    KazakhstanCityEnum:
      enum:
      - kz-astana
      - kz-almaty
      - kz-shymkent
      - kz-kokshetau
      - kz-aktobe
      - kz-atyrau
      - kz-oral
      - kz-aktau
      - kz-kostanay
      - kz-petropavl
      - kz-pavlodar
      - kz-karaganda
      - kz-zhezkazgan
      - kz-oskemen
      - kz-semey
      - kz-taldykorgan
      - kz-konaev
      - kz-taraz
      - kz-kyzylorda
      - kz-turkistan
      type: string
      description: |-
        * `kz-astana` - kz-astana
        * `kz-almaty` - kz-almaty
        * `kz-shymkent` - kz-shymkent
        * `kz-kokshetau` - kz-kokshetau
        * `kz-aktobe` - kz-aktobe
        * `kz-atyrau` - kz-atyrau
        * `kz-oral` - kz-oral
        * `kz-aktau` - kz-aktau
        * `kz-kostanay` - kz-kostanay
        * `kz-petropavl` - kz-petropavl
        * `kz-pavlodar` - kz-pavlodar
        * `kz-karaganda` - kz-karaganda
        * `kz-zhezkazgan` - kz-zhezkazgan
        * `kz-oskemen` - kz-oskemen
        * `kz-semey` - kz-semey
        * `kz-taldykorgan` - kz-taldykorgan
        * `kz-konaev` - kz-konaev
        * `kz-taraz` - kz-taraz
        * `kz-kyzylorda` - kz-kyzylorda
        * `kz-turkistan` - kz-turkistan
    KindEnum:
      enum:
      - bus
      - rail
      - taxi
      type: string
      description: |-
        * `bus` - Bus stop
        * `rail` - Railway station
        * `taxi` - Taxi rank
    LegIn:
      type: object
      description: A bus/train leg (`departure_id`) or a simulated taxi leg (`taxi_offer_id`
        + `ready_at`).
      properties:
        departure_id:
          type: integer
        taxi_offer_id:
          type: integer
        ready_at:
          type: string
          format: date-time
          description: 'Taxi as first leg: when the passenger is ready'
        from_stop:
          type: string
          description: Stop code
        to_stop:
          type: string
          description: Stop code
      required:
      - from_stop
      - to_stop
    LoginIn:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    ModesEnum:
      enum:
      - bus,train
      - bus
      - train
      type: string
      description: |-
        * `bus,train` - bus,train
        * `bus` - bus
        * `train` - train
    OutcomeEnum:
      enum:
      - success
      - failure
      type: string
      description: |-
        * `success` - success
        * `failure` - failure
    PatchedFareIn:
      type: object
      properties:
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
    PatchedServiceIn:
      type: object
      properties:
        route_id:
          type: integer
        departs_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 500
          minimum: 1
        wheelchair_accessible:
          type: boolean
          nullable: true
    PayIn:
      type: object
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          description: |-
            Simulator only: force success or failure.

            * `success` - success
            * `failure` - failure
      required:
      - outcome
    PlanInput:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/KazakhstanCityEnum'
        destination:
          $ref: '#/components/schemas/KazakhstanCityEnum'
        date:
          type: string
          format: date
        time:
          type: string
          format: time
          default: 06:00:00
        passengers:
          type: integer
          maximum: 9
          minimum: 1
          default: 1
        modes:
          allOf:
          - $ref: '#/components/schemas/ModesEnum'
          default: bus,train
        note:
          type: string
          default: ''
          maxLength: 1000
      required:
      - date
      - destination
      - origin
    PlanOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        origin:
          type: string
          maxLength: 40
        destination:
          type: string
          maxLength: 40
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        passengers:
          type: integer
          maximum: 32767
          minimum: 0
        modes:
          type: string
          maxLength: 16
        note:
          type: string
          maxLength: 1000
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - date
      - destination
      - id
      - origin
      - time
      - updated_at
    RegisterIn:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - email
      - full_name
      - password
    ResetIn:
      type: object
      properties:
        uid:
          type: string
          maxLength: 100
        token:
          type: string
          maxLength: 200
        password:
          type: string
          writeOnly: true
      required:
      - password
      - token
      - uid
    SearchResponse:
      type: object
      properties:
        simulated:
          type: boolean
        window_hours:
          type: integer
        count:
          type: integer
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - results
      - simulated
      - window_hours
    ServiceIn:
      type: object
      properties:
        route_id:
          type: integer
        departs_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 500
          minimum: 1
        wheelchair_accessible:
          type: boolean
          nullable: true
    Stop:
      type: object
      properties:
        code:
          type: string
          maxLength: 16
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        hub:
          type: string
          readOnly: true
        step_free:
          type: boolean
          nullable: true
      required:
      - code
      - hub
      - kind
      - name
    TokenIn:
      type: object
      properties:
        uid:
          type: string
          maxLength: 100
        token:
          type: string
          maxLength: 200
      required:
      - token
      - uid
    TravellerIn:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
      required:
      - full_name
    TravellerOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
      required:
      - full_name
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django session cookie. Unsafe methods also need the X-CSRFToken
        header (cookie `csrftoken`).
